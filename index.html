<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">

  <title>Frontend Mentor | NFT preview card component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution {
      font-size: 0.6875rem;
      text-align: center;
      color: hsl(0, 0%, 100%);
    }

    .attribution a {
      color: hsl(219, 62%, 58%);
    }
  </style>
</head>

<body>
  <div class="contaner">

    <header id="mainheader">
      <img src="image-equilibrium.jpg" alt="equilibrium" class="image">
      <img src="icon-view.svg" alt="view" class="icon">
    </header>

    <section id="mainsection">
      <div class="Equilibrium"><a href="#"> Equilibrium #3429</a></div>
      <p class="balance">Our Equilibrium collection promotes balance and calm.</p>
      <div class="eth"> <img src="icon-ethereum.svg" alt="ethereum">0.041 ETH</div>
      <span class="days"> <img src="icon-clock.svg" alt="clock"> 3 days left</span>
      <img src="image-avatar.png" alt="avatar" class="avatar">
      <p class="ava"> Creation of <a href="#" class="avatarlink">Jules Wyvern</a></p>
    </section>

  </div>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="#">Goodluck Seun Obala</a>.
  </footer>
</body>

</html>
